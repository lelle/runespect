name: Release

on:
  push:
    branches: [main]
  # A release started by hand, for when no push to main is due.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Version PR
    # Releases come from the public repository only; npm provenance needs a public source.
    if: github.repository == 'lelle/runespect'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the version branch
      pull-requests: write # open or update "chore: version packages"
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      unpublished: ${{ steps.unpublished.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update the version pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Find versions that are not on npm yet
        id: unpublished
        run: |
          pending="$(node scripts/unpublished-packages.ts)"
          echo "$pending"
          echo "pending=$([ -n "$pending" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: version
    # Ask for approval only when there is something to publish.
    if: >-
      github.repository == 'lelle/runespect' && needs.version.outputs.has-changesets == 'false' &&
      needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment: a maintainer approves each publish. A waiting publish holds the
    # concurrency group, so approve or cancel it right away.
    environment: Release
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm links a package to this workflow only once it exists: the first version of each is a
      # 0.0.0-placeholder published by hand.
      - name: Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
