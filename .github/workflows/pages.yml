name: Project site

# Builds the project site from docs/ and apps/site, with the demo from apps/demo, and
# publishes it to GitHub Pages at https://lelle.github.io/runespect/. Pages publishes only from a
# public repository with Pages switched on ("GitHub Actions" as its source, Settings → Pages); a
# private fork builds the site without publishing it.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/**
      - apps/**
      - .changeset/**
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site's diagrams are drawn in Chrome when it is built.
      - name: Install Chrome for Playwright
        run: pnpm exec playwright install chrome
      - name: Build the site and the demo
        run: pnpm site:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event.repository.visibility == 'public'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event.repository.visibility == 'public'
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
